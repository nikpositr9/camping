<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CAMPORA — проверка адаптива</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e8eb;font:14px Arial;color:#111820}header{padding:12px 18px;background:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2}button,a,select{font:inherit;min-height:40px;padding:8px 12px;border:1px solid #bbc1c5;border-radius:4px;background:#fff;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#111820;color:#fff}a{text-decoration:none}main{padding:18px;overflow:auto}iframe{display:block;width:390px;height:844px;border:0;background:#fff;margin:auto;box-shadow:0 5px 30px #0002}#size{margin-left:auto}</style><header><strong>CAMPORA</strong><button data-width="390" aria-pressed="true">Телефон 390</button><button data-width="768" aria-pressed="false">Планшет 768</button><button data-width="1440" aria-pressed="false">Компьютер 1440</button><select aria-label="Перейти к блоку"><option value="">Первый экран</option><option value="catalog-grid">Товары</option><option value="category-seo">SEO-текст</option><option value="category-reviews">Видеообзоры</option><option value="contacts">Подвал</option></select><a href="catalog.html?category=tents">Открыть сайт</a><span id="size">390 × 844</span></header><main><iframe title="Предпросмотр CAMPORA" src="catalog.html?category=tents"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{const w=Number(b.dataset.width);frame.style.width=w+'px';frame.style.height=(w===1440?900:844)+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('size').textContent=w+' × '+(w===1440?900:844)});document.querySelector('select').onchange=e=>{frame.src='catalog.html?category=tents'+(e.target.value?'#'+e.target.value:'')};</script></html>
